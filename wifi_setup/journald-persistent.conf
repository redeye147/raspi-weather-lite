# ログ（journal）を SD カードにも保存し、再起動・強制再起動の前の起動の記録を後から見られるようにする
# （journalctl -b -1）。Raspberry Pi OS は既定でメモリだけ（再起動で消える）。
# 2026-10-14 の 110 で、WiFi につながらなかった起動の記録が残っておらず原因を確定できなかった件の対策。
# setup.sh / update.sh が /etc/systemd/journald.conf.d/ に配置する。SD への書き込みを抑えるため上限 50MB。
[Journal]
Storage=persistent
SystemMaxUse=50M
