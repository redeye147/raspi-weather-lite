# WiFi の省電力（power save）を切る。Raspberry Pi の内蔵 WiFi（brcmfmac）は省電力が有効だと
# 接続が不安定になったり、名前解決（DNS）がときどき失敗したりすることが知られている。
# 2026-10-14 に 110 で再起動後 15 分 WiFi につながらなかった件の対策（消費電力はわずかに増える）。
# setup.sh / update.sh が /etc/NetworkManager/conf.d/ に配置する（次に WiFi につなぐときから有効。
# 配置時に iw でも今の接続の省電力を切る）。wifi.powersave: 2 = 無効
[connection-wifi-powersave-off]
match-device=type:wifi
wifi.powersave=2
